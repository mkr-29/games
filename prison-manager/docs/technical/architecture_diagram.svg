<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .system-box { fill: #e8f4fd; stroke: #2c6ea0; stroke-width: 2; }
      .data-box { fill: #fff2e8; stroke: #d35400; stroke-width: 2; }
      .entity-box { fill: #e8f8e8; stroke: #27ae60; stroke-width: 2; }
      .gradient-box { fill: url(#grad1); stroke: #8e44ad; stroke-width: 2; }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4fd;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Prison Manager - ECS Architecture & Data Flow</text>

  <!-- Core ECS Components -->
  <rect x="50" y="80" width="200" height="120" class="system-box" />
  <text x="150" y="105" text-anchor="middle" class="label">Entity Manager</text>
  <text x="150" y="125" text-anchor="middle" class="label">• Entity Creation/Deletion</text>
  <text x="150" y="145" text-anchor="middle" class="label">• Component Registration</text>
  <text x="150" y="165" text-anchor="middle" class="label">• Entity Queries</text>

  <rect x="300" y="80" width="200" height="120" class="system-box" />
  <text x="400" y="105" text-anchor="middle" class="label">Component System</text>
  <text x="400" y="125" text-anchor="middle" class="label">• Data Storage</text>
  <text x="400" y="145" text-anchor="middle" class="label">• Component Types</text>
  <text x="400" y="165" text-anchor="middle" class="label">• Validation & Defaults</text>

  <rect x="550" y="80" width="200" height="120" class="system-box" />
  <text x="650" y="105" text-anchor="middle" class="label">System Scheduler</text>
  <text x="650" y="125" text-anchor="middle" class="label">• System Registration</text>
  <text x="650" y="145" text-anchor="middle" class="label">• Execution Order</text>
  <text x="650" y="165" text-anchor="middle" class="label">• Parallel Processing</text>

  <!-- Entity Examples -->
  <rect x="50" y="230" width="180" height="100" class="entity-box" />
  <text x="140" y="250" text-anchor="middle" class="label">Inmate Entity</text>
  <text x="140" y="270" text-anchor="middle" class="label" font-size="10">ID: 1001</text>
  <text x="140" y="285" text-anchor="middle" class="label" font-size="10">Position, Needs,</text>
  <text x="140" y="295" text-anchor="middle" class="label" font-size="10">Temperament, Schedule</text>

  <rect x="310" y="230" width="180" height="100" class="entity-box" />
  <text x="400" y="250" text-anchor="middle" class="label">Staff Entity</text>
  <text x="400" y="270" text-anchor="middle" class="label" font-size="10">ID: 2001</text>
  <text x="400" y="285" text-anchor="middle" class="label" font-size="10">Role, Attributes,</text>
  <text x="400" y="295" text-anchor="middle" class="label" font-size="10">Schedule, Status</text>

  <rect x="570" y="230" width="180" height="100" class="entity-box" />
  <text x="660" y="250" text-anchor="middle" class="label">Structural Entity</text>
  <text x="660" y="270" text-anchor="middle" class="label" font-size="10">ID: 3001</text>
  <text x="660" y="285" text-anchor="middle" class="label" font-size="10">Construction,</text>
  <text x="660" y="295" text-anchor="middle" class="label" font-size="10">Security, Connections</text>

  <!-- Key Systems -->
  <rect x="50" y="360" width="220" height="80" class="gradient-box" />
  <text x="160" y="380" text-anchor="middle" class="label">Needs System</text>
  <text x="160" y="395" text-anchor="middle" class="label" font-size="10">Updates hunger, hygiene,</text>
  <text x="160" y="405" text-anchor="middle" class="label" font-size="10">health, comfort over time</text>

  <rect x="290" y="360" width="220" height="80" class="gradient-box" />
  <text x="400" y="380" text-anchor="middle" class="label">AI System</text>
  <text x="400" y="395" text-anchor="middle" class="label" font-size="10">Goal-oriented behavior</text>
  <text x="400" y="405" text-anchor="middle" class="label" font-size="10">Based on needs & temperament</text>

  <rect x="530" y="360" width="220" height="80" class="gradient-box" />
  <text x="640" y="380" text-anchor="middle" class="label">Movement System</text>
  <text x="640" y="395" text-anchor="middle" class="label" font-size="10">Pathfinding & collision</text>
  <text x="640" y="405" text-anchor="middle" class="label" font-size="10">Avoids obstacles & entities</text>

  <rect x="150" y="460" width="180" height="80" class="gradient-box" />
  <text x="240" y="480" text-anchor="middle" class="label">Utility System</text>
  <text x="240" y="495" text-anchor="middle" class="label" font-size="10">Power/water distribution</text>
  <text x="240" y="505" text-anchor="middle" class="label" font-size="10">Consumption tracking</text>

  <rect x="390" y="460" width="220" height="80" class="gradient-box" />
  <text x="500" y="480" text-anchor="middle" class="label">Security System</text>
  <text x="500" y="495" text-anchor="middle" class="label" font-size="10">Contraband detection</text>
  <text x="500" y="505" text-anchor="middle" class="label" font-size="10">Lockdown procedures</text>

  <rect x="650" y="460" width="100" height="80" class="gradient-box" />
  <text x="700" y="480" text-anchor="middle" class="label">Reporting</text>
  <text x="700" y="495" text-anchor="middle" class="label" font-size="10">KPIs & analytics</text>
  <text x="700" y="505" text-anchor="middle" class="label" font-size="10">Financial metrics</text>

  <!-- Data Flow Arrows -->
  <line x1="150" y1="200" x2="150" y2="230" class="arrow" />
  <line x1="400" y1="200" x2="400" y2="230" class="arrow" />
  <line x1="650" y1="200" x2="650" y2="230" class="arrow" />

  <line x1="150" y1="330" x2="160" y2="360" class="arrow" />
  <line x1="400" y1="330" x2="400" y2="360" class="arrow" />
  <line x1="650" y1="330" x2="640" y2="360" class="arrow" />

  <line x1="160" y1="440" x2="240" y2="460" class="arrow" />
  <line x1="400" y1="440" x2="400" y2="460" class="arrow" />
  <line x1="640" y1="440" x2="500" y2="460" class="arrow" />
  <line x1="640" y1="440" x2="700" y2="460" class="arrow" />

  <!-- Feedback loops -->
  <line x1="240" y1="540" x2="160" y2="440" class="arrow" stroke="#e74c3c" />
  <line x1="500" y1="540" x2="400" y2="440" class="arrow" stroke="#e74c3c" />
  <line x1="700" y1="540" x2="400" y2="440" class="arrow" stroke="#e74c3c" />

  <text x="160" y="555" text-anchor="middle" class="label" font-size="10" fill="#e74c3c">Feedback</text>
  <text x="400" y="555" text-anchor="middle" class="label" font-size="10" fill="#e74c3c">Feedback</text>
  <text x="700" y="555" text-anchor="middle" class="label" font-size="10" fill="#e74c3c">Feedback</text>

  <!-- Legend -->
  <rect x="50" y="520" width="150" height="60" class="box" />
  <text x="125" y="535" text-anchor="middle" class="title" font-size="12">Legend</text>
  <rect x="60" y="545" width="12" height="12" class="system-box" />
  <text x="80" y="555" class="label" font-size="10">Systems</text>
  <rect x="60" y="562" width="12" height="12" class="entity-box" />
  <text x="80" y="572" class="label" font-size="10">Entities</text>
  <rect x="60" y="579" width="12" height="12" class="gradient-box" />
  <text x="80" y="589" class="label" font-size="10">Key Systems</text>
  <line x1="70" y1="595" x2="82" y2="595" class="arrow" stroke="#e74c3c" />
  <text x="90" y="600" class="label" font-size="10" fill="#e74c3c">Feedback Loops</text>
</svg>